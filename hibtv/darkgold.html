<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>海白菜 · 暗金改造方案 · 可点击原型</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  /* 与 prototype.html 同一套暗金令牌 */
  --bg:#0a0908;--bg-2:#0e0d0b;--panel:#131110;--panel-2:#191614;--panel-3:#211d19;
  --line:rgba(224,179,106,.16);--line-2:rgba(255,255,255,.075);--line-3:rgba(255,255,255,.04);
  --brand:#e0b36a;--brand-2:#f3d7a8;--brand-dim:rgba(224,179,106,.45);
  --brand-soft:rgba(224,179,106,.10);
  --brand-grad:linear-gradient(180deg,#eac389,#dcaa5e);
  --on-brand:#1b1611;
  --text:#e9e3d7;--muted:#948b7e;--dim:#635c53;
  --red:#cf6a5f;--green:#7cae8b;--blue:#7d9ab5;
  --soft-1:rgba(255,255,255,.022);--soft-2:rgba(255,255,255,.05);
  --media:#100e0c;
  --shadow:0 26px 60px -34px rgba(0,0,0,.95);
  --r:12px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --serif:"Noto Sans SC","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
}
/* 明色对照：只换令牌，不改结构 —— 用来判断"换皮"是否保住海白菜的可读性 */
body.light{
  --bg:#f5f8fa;--bg-2:#fbfdfe;--panel:#ffffff;--panel-2:#f7fafc;--panel-3:#eef4f8;
  --line:rgba(75,107,245,.20);--line-2:rgba(15,23,42,.11);--line-3:rgba(15,23,42,.07);
  --brand:#4b6bf5;--brand-2:#2f4fd6;--brand-dim:rgba(75,107,245,.5);
  --brand-soft:rgba(75,107,245,.09);
  --brand-grad:linear-gradient(180deg,#5b7bff,#3f5ee6);
  --on-brand:#ffffff;
  --text:#152033;--muted:#586878;--dim:#8795a4;
  --red:#c8524a;--green:#2f8f66;--blue:#3a6f9e;
  --soft-1:rgba(15,23,42,.02);--soft-2:rgba(15,23,42,.055);
  --shadow:0 18px 40px -30px rgba(20,35,60,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.66 var(--sans);-webkit-font-smoothing:antialiased;min-height:100%;
  transition:background .25s}
a{color:var(--brand);text-decoration:none}
button{font-family:var(--sans)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--soft-2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
/* 顶部光斑：只是背景装饰，不占任何布局 */
body::before{content:"";position:fixed;inset:0 0 auto;height:460px;pointer-events:none;z-index:0;
  background:radial-gradient(52% 60% at 20% 0%,rgba(224,179,106,.09),transparent 64%),radial-gradient(40% 46% at 86% 0%,rgba(207,106,95,.05),transparent 62%)}
body.light::before{background:radial-gradient(52% 60% at 20% 0%,rgba(75,107,245,.07),transparent 64%)}
.shell{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh}
/* ---------- 顶部导航：尺寸与线上 Layout 一一对应（h-14 / max-w-7xl / px-4 / gap-4） ---------- */
.nav{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line-3);background:rgba(10,9,8,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
body.light .nav{background:rgba(245,248,250,.86)}
.nav-in{max-width:1280px;margin:0 auto;height:56px;display:flex;align-items:center;gap:16px;padding:0 16px}
.nav .menu{display:flex;align-items:center;gap:4px}
.nvi{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:6px 12px;font-size:13px;line-height:1.4;color:var(--muted);background:none;border:none;cursor:pointer;white-space:nowrap}
.nvi:hover{background:var(--soft-2);color:var(--text)}
.nvi.on{background:var(--brand-soft);color:var(--brand-2)}
.nvi .i{font:12px/1 var(--mono);opacity:.8}
.nav-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.credit{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--brand-soft);color:var(--brand-2);font-size:13px;cursor:pointer}
.credit:hover{background:rgba(224,179,106,.16)}
body.light .credit,body.light .credit:hover{background:var(--brand-soft)}
.mail{font-size:13px;color:var(--muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ibtn{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid transparent;background:none;color:var(--muted);cursor:pointer;font-size:14px}
.ibtn:hover{background:var(--soft-2);color:var(--text)}
/* 协议更新横幅（线上 LegalNotice，可关闭） */
.legal{border-bottom:1px solid var(--line);background:var(--brand-soft)}
.legal-in{max-width:1280px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px;font-size:12px;color:var(--brand-2)}
.legal-in .sp{flex:1;line-height:1.7}
.legal-in a{text-decoration:underline;color:var(--brand-2)}
.legal-in .x{border:none;background:none;color:var(--brand-2);cursor:pointer;font-size:13px;padding:2px 6px;border-radius:6px}
/* ---------- 内容区：与线上 main（max-w-7xl px-4 py-6）一致 ---------- */
.main{flex:1;width:100%;max-width:1280px;margin:0 auto;padding:24px 16px}
.wrap{max-width:100%}
/* 页脚（线上 footer：法律四入口 + 版权 + 版本） */
.foot{border-top:1px solid var(--line-3);padding:20px 16px;text-align:center;font-size:12px;color:var(--dim)}
.foot .links{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;margin-bottom:8px}
.foot .links a{color:var(--muted)}
.foot .links a:hover{color:var(--brand-2);text-decoration:underline}
.foot p{margin:0;line-height:1.9}
/* 方案工具条：固定右下、不占文档流，线上页面截图不受影响 */
.dock{position:fixed;right:16px;bottom:16px;z-index:35;display:flex;align-items:center;gap:6px;padding:6px;border:1px solid var(--line);border-radius:11px;background:rgba(19,17,16,.94);backdrop-filter:blur(10px);box-shadow:var(--shadow)}
body.light .dock{background:rgba(255,255,255,.95)}
.dock .lbl{font:9.5px var(--mono);letter-spacing:.12em;color:var(--dim);padding:0 4px 0 2px}
/* ---------- 品牌 ---------- */
.lockup{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.lockup .word{font:600 17px var(--sans);letter-spacing:.1em;color:var(--text);margin-right:-.1em;white-space:nowrap}
.mk{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;border-radius:10px;transition:.2s}
.mk img{width:100%;height:100%;object-fit:contain;display:block;user-select:none}
.mk .fb{display:none;font:600 15px/1 var(--sans);color:var(--brand-2)}
.mk.fail img{display:none}
.mk.fail .fb{display:block}
.mk.raw img{filter:drop-shadow(0 4px 12px rgba(0,0,0,.55))}
.mk.glow img{filter:drop-shadow(0 0 10px rgba(224,179,106,.5)) drop-shadow(0 3px 9px rgba(0,0,0,.65))}
.mk.badge{background:radial-gradient(130% 130% at 28% 18%,#1c1813,#0c0a08);border:1px solid var(--line);padding:3px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.mk.badge img{filter:saturate(.7) brightness(.94) contrast(1.04)}
.mk.mono img{filter:grayscale(1) brightness(1.02) sepia(1) saturate(2.7) hue-rotate(-8deg)}
body.light .mk.badge{background:#fff;border-color:var(--line-2)}
body.light .mk.raw img,body.light .mk.glow img{filter:drop-shadow(0 4px 12px rgba(20,35,60,.18))}
/* ---------- typography ---------- */
.eyebrow{font:10.5px/1 var(--mono);letter-spacing:.18em;color:var(--dim);text-transform:uppercase;margin-bottom:10px}
.eyebrow em{color:var(--brand-dim);font-style:normal}
.h2{font-size:13.5px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.h2::before{content:"";width:2px;height:12px;background:var(--brand);border-radius:2px}
.h3{font-size:12.5px;font-weight:600;color:var(--text);margin:0 0 8px}
.lede{color:var(--muted);font-size:12.5px;max-width:860px;margin:0}
.lede em{color:var(--brand-2);font-style:normal}
.mut{color:var(--muted)}.dim{color:var(--dim)}
.mono{font-family:var(--mono)}
.tiny{font-size:10.5px}.small{font-size:11.5px}
.sec{margin-top:28px}
hr.rule{border:none;border-top:1px solid var(--line-3);margin:16px 0}
/* ---------- buttons / chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--soft-1);color:var(--text);font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--line);color:var(--brand-2);background:var(--brand-soft)}
.btn.primary{background:var(--brand-grad);border-color:transparent;color:var(--on-brand);font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 26px -16px var(--brand-dim)}
.btn.primary:hover{filter:brightness(1.06);color:var(--on-brand)}
.btn.ghost{background:transparent}
.btn.sm{height:28px;padding:0 10px;font-size:11.5px;border-radius:8px}
.btn.xs{height:24px;padding:0 8px;font-size:10.5px;border-radius:6px}
.btn.pill{border-radius:999px}
.btn.primary.pill{height:40px;padding:0 20px;font-size:13.5px}
.btn.dis{opacity:.4;pointer-events:none}
.btn.on{border-color:var(--brand-dim);color:var(--brand-2);background:var(--brand-soft)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:5px;background:var(--soft-2);border:1px solid var(--line-2);color:var(--muted);font-size:11px;white-space:nowrap}
.chip.gold{background:var(--brand-soft);border-color:var(--line);color:var(--brand-2)}
.chip.red{background:rgba(207,106,95,.12);border-color:rgba(207,106,95,.3);color:var(--red)}
.chip.green{background:rgba(124,174,139,.1);border-color:rgba(124,174,139,.28);color:var(--green)}
.chip.ghost{background:transparent}
.chip.i{cursor:pointer}
.chip.i:hover{border-color:var(--line);color:var(--brand-2)}
.chip.pill{border-radius:999px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block}
.dot.gold{background:var(--brand)}.dot.red{background:var(--red)}.dot.gray{background:var(--dim)}
/* ---------- forms ---------- */
.field{margin-bottom:13px}
.label{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);margin-bottom:6px}
.label .req{color:var(--brand);font-size:10px}
.label .auto{margin-left:auto;font:10px var(--mono);color:var(--dim)}
.input,.select,.textarea{width:100%;background:var(--bg-2);border:1px solid var(--line-2);border-radius:12px;color:var(--text);font:13px var(--sans);padding:10px 14px;outline:none}
.input:focus,.select:focus,.textarea:focus{border-color:var(--brand-dim);box-shadow:0 0 0 3px var(--brand-soft)}
.textarea{resize:vertical;min-height:64px;line-height:1.7}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.switch{display:inline-flex;align-items:center;gap:7px;cursor:pointer;color:var(--muted);font-size:11.5px}
.switch input{display:none}
.switch .track{width:26px;height:15px;border-radius:8px;background:var(--soft-2);border:1px solid var(--line-2);position:relative;transition:.15s}
.switch .track::after{content:"";position:absolute;top:1.5px;left:1.5px;width:10px;height:10px;border-radius:50%;background:var(--muted);transition:.15s}
.switch input:checked + .track{background:var(--brand-soft);border-color:var(--brand-dim)}
.switch input:checked + .track::after{left:13px;background:var(--brand)}
/* ---------- cards / tables ---------- */
.card{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line-2);border-radius:var(--r)}
.card.pad{padding:16px}
.card-hd{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line-3)}
.card-hd .t{font-size:12.5px;color:var(--text)}
.card-hd .r{margin-left:auto;font:10.5px var(--mono);color:var(--dim)}
.card-bd{padding:14px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;font-weight:500;color:var(--dim);font-size:10.5px;letter-spacing:.1em;padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line-3);color:var(--text);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--soft-1)}
.tbl tr.click{cursor:pointer}
.tbl .id{font:11px var(--mono);color:var(--brand-dim)}
.tbl .nm{color:var(--text)}
.tbl .num{font:11.5px var(--mono);text-align:right}
.tbl .nw{white-space:nowrap}
.tbl .pos{color:var(--green);font:11.5px var(--mono);text-align:right}
.tbl .neg{color:var(--red);font:11.5px var(--mono);text-align:right}
.note{border-left:2px solid var(--brand-dim);background:var(--brand-soft);border-radius:0 8px 8px 0;padding:11px 13px;color:var(--muted);font-size:12px;line-height:1.85}
.note b{color:var(--brand-2);font-weight:500}
ul.list{margin:8px 0 0;padding-left:17px;color:var(--muted);font-size:12px;line-height:1.95}
ul.list b{color:var(--text);font-weight:500}
ul.list em{color:var(--brand-dim);font-style:normal}
code{font:11px var(--mono);background:var(--brand-soft);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--brand-2)}
pre.code{margin:0;background:var(--bg-2);border:1px solid var(--line-2);border-radius:9px;padding:12px 14px;overflow:auto;font:11px/1.85 var(--mono);color:var(--muted)}
pre.code i{color:var(--brand-2);font-style:normal}
pre.code em{color:var(--green);font-style:normal}
.empty{border:1px dashed var(--line-2);border-radius:12px;padding:30px 20px;text-align:center;background:radial-gradient(120% 90% at 50% -10%,var(--brand-soft),transparent 60%)}
.empty .glyph{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--brand);font:14px var(--serif);margin:0 auto 10px}
.empty .t{color:var(--text);font-size:13px;margin-bottom:4px}
.empty .s{color:var(--dim);font-size:11.5px}
/* ---------- segmented / tabs / stepper ---------- */
.seg{display:inline-flex;padding:2px;border-radius:8px;background:var(--soft-1);border:1px solid var(--line-2)}
.seg .s{padding:5px 11px;border-radius:6px;font-size:11.5px;color:var(--muted);cursor:pointer;border:none;background:none;display:inline-flex;align-items:center;gap:5px}
.seg .s:hover{color:var(--text)}
.seg .s.on{background:var(--brand-soft);color:var(--brand-2);box-shadow:inset 0 0 0 1px var(--line)}
/* 线上圆角胶囊版（画面比例等）：形状对齐 rounded-full bg-background-200 p-1 */
.seg.pill{border:none;border-radius:999px;background:var(--soft-2);padding:4px}
.seg.pill .s{border-radius:999px;padding:4px 12px;font-size:12px}
/* 线上 segmented（rounded-xl bg-background-200 p-1 text-sm） */
.seg.lg{padding:4px;border-radius:12px;background:var(--soft-2);border:none}
.seg.lg .s{padding:6px 16px;border-radius:8px;font-size:13px}
.seg.lg .s.on{background:var(--panel-2);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.3)}
body.light .seg.lg .s.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(15,23,42,.1)}
.seg.pill .s.on{background:var(--panel-2);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.3)}
body.light .seg.pill .s.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(15,23,42,.1)}
/* 提交区（线上 panel p-5 居中，不做粘底） */
.subpanel{border:1px solid var(--line-2);border-radius:12px;background:linear-gradient(180deg,var(--panel-2),var(--panel));padding:20px}
.tabs{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tab{height:27px;padding:0 10px;border-radius:6px;border:1px solid var(--line-2);color:var(--muted);font-size:11.5px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;background:none}
.tab:hover{color:var(--text);border-color:var(--line)}
.tab.on{background:var(--brand-soft);border-color:var(--line);color:var(--brand-2)}
.tab .n{font:10px var(--mono);opacity:.7}
/* 模式切换：与线上 ModeTabs 一致（居中、胶囊容器、胶囊按钮，尺寸不变） */
.modewrap{display:flex;justify-content:center}
.mtabs{display:inline-flex;padding:4px;border-radius:999px;background:var(--soft-2)}
.mtab{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 14px;border:none;border-radius:999px;background:none;color:var(--muted);font-size:13px;cursor:pointer;white-space:nowrap}
.mtab:hover{color:var(--text)}
.mtab.on{background:var(--panel-2);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.32)}
body.light .mtab.on{background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.1)}
/* 线上内容块间距：space-y-6 */
.cstack{display:flex;flex-direction:column;gap:24px;margin-top:24px}
/* 页面标题：对齐线上 h1 18px / h2 16px，不做衬线放大 */
.page-h{font-size:18px;font-weight:600;line-height:1.4;color:var(--text);margin:0}
.ptitle{font-size:16px;font-weight:600;line-height:1.4;color:var(--text)}
.stepper{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin:14px 0 18px}
.step{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 10px;border:1px solid var(--line-2);background:var(--soft-1);cursor:pointer;font-size:11.5px;color:var(--muted)}
.step:first-child{border-radius:8px 0 0 8px}
.step:last-child{border-radius:0 8px 8px 0}
.step .n{width:16px;height:16px;border-radius:50%;border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;font:9.5px var(--mono);color:var(--dim)}
.step.done .n{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.step.on{background:var(--brand-soft);border-color:var(--line);color:var(--brand-2)}
.step.on .n{border-color:var(--brand);color:var(--brand)}
.step:hover{color:var(--brand-2)}
/* ---------- media placeholders ---------- */
.plate{position:relative;overflow:hidden;border-radius:9px;border:1px solid var(--line-2);background:var(--media);display:flex;align-items:center;justify-content:center;isolation:isolate}
.plate .ph{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;
  background:radial-gradient(120% 80% at 50% 0%,rgba(224,179,106,.12),transparent 62%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.026) 0 1px,transparent 1px 26px),
  repeating-linear-gradient(90deg,rgba(255,255,255,.026) 0 1px,transparent 1px 26px),
  linear-gradient(165deg,#241f19,#15120f 58%,#0e0d0b)}
.plate .ph b{font:500 10px/1.4 var(--mono);letter-spacing:.09em;color:#a79d8d;padding:0 8px}
.plate .ph i{font-style:normal;font:9px var(--mono);letter-spacing:.12em;color:#6f675c}
.plate .ph::before{content:"";width:30px;height:30px;border-radius:50%;border:1px solid rgba(224,179,106,.22);box-shadow:inset 0 0 16px rgba(224,179,106,.1);margin-bottom:2px}
.plate.k-video .ph::before{border-radius:3px}
.plate.k-video .ph::after{content:"";position:absolute;width:0;height:0;border-left:6px solid rgba(224,179,106,.55);border-top:4px solid transparent;border-bottom:4px solid transparent;margin-left:2px}
.plate .badge{position:absolute;z-index:3;left:6px;top:6px}
.refthumb .plate,.cand .plate,.pick .plate{position:absolute;inset:0;border:none;border-radius:0}
select.toolchip{appearance:none;padding-right:20px;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 12px) 12px,calc(100% - 8px) 12px;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.plate .corner{position:absolute;z-index:3;right:6px;bottom:6px}
.plate .tools{position:absolute;z-index:4;inset:0 0 auto;display:flex;gap:5px;padding:6px;background:linear-gradient(180deg,rgba(0,0,0,.72),transparent);opacity:0;transition:.15s}
.plate:hover .tools{opacity:1}
.ic{width:24px;height:24px;border-radius:6px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.5);color:#e9e3d7;font-size:11px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.ic:hover{border-color:var(--brand-dim);color:var(--brand-2);background:rgba(224,179,106,.16)}
.prog{height:4px;border-radius:3px;background:var(--soft-2);overflow:hidden}
.prog > i{display:block;height:100%;background:linear-gradient(90deg,#c99b55,#f3d7a8);border-radius:3px;transition:width .35s}
body.light .prog > i{background:linear-gradient(90deg,#5b7bff,#8fa6ff)}
/* ---------- product: composer ---------- */
.composer{border:1px solid var(--line-2);border-radius:16px;background:linear-gradient(180deg,var(--panel-2),var(--panel));box-shadow:var(--shadow);padding:20px}
.compose-grid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:start}
.refgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.refslot{aspect-ratio:1;border:1px dashed var(--line-2);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);cursor:pointer;background:var(--soft-1);font-size:10px;text-align:center;padding:4px}
.refslot:hover{border-color:var(--brand-dim);color:var(--brand-2);background:var(--brand-soft)}
.refslot .plus{font:16px/1 var(--mono)}
.refthumb{position:relative;aspect-ratio:1;border-radius:9px;overflow:hidden;border:1px solid var(--line-2);cursor:pointer}
.refthumb:hover{border-color:var(--brand-dim)}
.refthumb .x{position:absolute;z-index:4;top:3px;right:3px;width:16px;height:16px;border-radius:4px;background:rgba(0,0,0,.62);color:#e9e3d7;font:10px/16px var(--mono);text-align:center;opacity:0;transition:.15s}
.refthumb .ph b{font-size:8.5px;letter-spacing:0;line-height:1.35;padding:0 5px}
.refthumb .ph i{font-size:8px;letter-spacing:.06em}
.refthumb .ph::before{width:20px;height:20px;margin-bottom:1px}
.refslot.wide{aspect-ratio:4/3}
.refthumb:hover .x{opacity:1}
.refthumb .lab{position:absolute;z-index:3;left:0;right:0;bottom:0;font:8.5px var(--mono);color:#cfc6b7;background:linear-gradient(0deg,rgba(0,0,0,.8),transparent);padding:8px 3px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.promptbox{position:relative}
.promptbox textarea{min-height:126px;width:100%;resize:none;background:transparent;border:none;outline:none;color:var(--text);font:13px/1.8 var(--sans);padding:2px 0}
.promptbox textarea::placeholder{color:var(--dim)}
.promptfoot{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:10.5px;color:var(--dim)}
.promptfoot .cnt{margin-left:auto;font-family:var(--mono)}
.toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line-3)}
.toolbar .sp{margin-left:auto;display:flex;align-items:center;gap:10px}
.toolchip{display:inline-flex;align-items:center;gap:6px;height:27px;padding:0 9px;border-radius:999px;border:1px solid var(--line-2);background:var(--soft-1);color:var(--muted);font-size:11.5px;cursor:pointer}
.toolchip:hover{border-color:var(--line);color:var(--brand-2)}
.toolchip.on{border-color:var(--brand-dim);color:var(--brand-2);background:var(--brand-soft)}
.toolchip .k{font:10px var(--mono);color:var(--dim)}
.cost{display:inline-flex;align-items:center;gap:5px;font:12.5px var(--mono);color:var(--text)}
.cost b{font-weight:600}
.pop{position:absolute;z-index:30;right:0;bottom:44px;width:250px;border:1px solid var(--line);border-radius:10px;background:var(--panel-3);box-shadow:var(--shadow);padding:10px}
.pop .r{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pop .r .k{font-size:10.5px;color:var(--dim);width:44px;flex:0 0 44px}
.pop .r .seg{flex:1}
.pop .r .seg .s{flex:1;justify-content:center;padding:4px 0}
/* ---------- product: tasks ---------- */
/* 作品卡：与线上 TaskCard 同构（panel p-4：chip 行 → 提示词 → 成片 → 操作行） */
.tasks{display:grid;gap:16px;grid-template-columns:1fr 1fr;align-items:start}
.task{border:1px solid var(--line-2);border-radius:16px;background:var(--panel);padding:16px}
.task:hover{border-color:var(--line)}
.task .chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.task .chips .when{margin-left:auto;font-size:11.5px;color:var(--dim)}
.task .prompt{margin:0 0 12px;font-size:13.5px;line-height:1.7;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.task .video{position:relative;height:200px;border-radius:12px;overflow:hidden;border:1px solid var(--line-2);margin-bottom:10px}
.task .video .plate{position:absolute;inset:0;border:none;border-radius:0}
.task .foot{display:flex;align-items:center;gap:8px}
.task .foot .cost{font-size:11.5px;color:var(--dim)}
.task .foot .del{margin-left:auto;width:26px;height:26px;border-radius:8px;border:none;background:none;color:var(--dim);cursor:pointer;font-size:13px}
.task .foot .del:hover{background:var(--soft-2);color:var(--red)}
.task .up{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line-3);font-size:11.5px;color:var(--dim)}
.task .run{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11.5px;color:var(--dim)}
.task .run .prog{flex:1}
.task .err{display:flex;align-items:flex-start;gap:10px;border-radius:12px;background:rgba(207,106,95,.08);padding:10px 12px;font-size:11.5px;line-height:1.7;color:var(--red);margin-bottom:10px}
.status{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:999px;font-size:10.5px;border:1px solid transparent;white-space:nowrap}
.status.run{background:var(--brand-soft);border-color:var(--line);color:var(--brand-2)}
.status.done{background:rgba(124,174,139,.12);border-color:rgba(124,174,139,.28);color:var(--green)}
.status.fail{background:rgba(207,106,95,.12);border-color:rgba(207,106,95,.3);color:var(--red)}
.spin{display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--brand-dim);border-top-color:var(--brand);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---------- product: director ---------- */
.shots{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.shot{border:1px solid var(--line-2);border-radius:12px;background:var(--panel);padding:16px}
.shot:hover{border-color:var(--line)}
.shot .hd{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.shot .no{width:24px;height:24px;border-radius:6px;background:var(--brand-soft);border:1px solid var(--line);color:var(--brand);display:flex;align-items:center;justify-content:center;font:600 11px var(--mono)}
.shot .hd .sp{margin-left:auto;display:flex;align-items:center;gap:6px}
.shot .body{display:grid;grid-template-columns:minmax(0,1fr) 216px;gap:12px}
.shot .refgrid{display:flex;flex-wrap:wrap;gap:6px}
.shot .refthumb{width:54px;height:54px;aspect-ratio:auto}
.shot .refslot{width:54px;height:54px;aspect-ratio:auto;font-size:9px;gap:0;padding:2px}
.shot .refthumb .ph b{display:none}
.shot .refthumb .ph i{font-size:7.5px;letter-spacing:0}
.shot .refthumb .ph::before{width:18px;height:18px}
.shot textarea{min-height:58px;font-size:12px}
.secrow{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);margin-top:8px}
.secrow .val{font:11.5px var(--mono);color:var(--brand-2);margin-left:auto}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:99px;background:var(--soft-2);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--brand);border:2px solid var(--panel);box-shadow:0 0 0 1px var(--brand-dim)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:none;border-radius:50%;background:var(--brand)}
/* ---------- product: advideo ---------- */
.cands{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.cand{position:relative;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;cursor:pointer;aspect-ratio:9/16}
.cand:hover{border-color:var(--line)}
.cand.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand-dim),0 12px 30px -22px var(--brand)}
.cand .tick{position:absolute;z-index:5;right:6px;top:6px;width:17px;height:17px;border-radius:50%;border:1px solid rgba(224,179,106,.5);background:rgba(0,0,0,.55);color:transparent;font:10px/16px var(--mono);text-align:center}
.cand.on .tick{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.cand .ph b{font-size:9px}
/* ---------- product: assets ---------- */
.astats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.astat{display:flex;align-items:center;gap:12px;border:1px solid var(--line-2);border-radius:12px;background:var(--panel);padding:16px}
.astat .ico{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--brand-soft);color:var(--brand);font-size:15px;flex:0 0 auto}
.astat b{display:block;font-size:20px;font-weight:600;line-height:1.2;color:var(--text)}
.astat i{display:block;font-style:normal;font-size:11.5px;color:var(--dim);margin-top:2px}
.afilter{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pillf{display:inline-flex;border-radius:999px;background:var(--soft-2);padding:4px}
.pillf button{display:inline-flex;align-items:center;gap:6px;border:none;background:none;border-radius:999px;padding:6px 16px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.pillf button:hover{color:var(--text)}
.pillf button.on{background:var(--brand-grad);color:var(--on-brand);font-weight:600}
.assets{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:12px}
.asset{position:relative;border:1px solid var(--line-2);border-radius:12px;overflow:hidden;background:var(--panel);cursor:pointer}
.asset:hover{border-color:var(--brand-dim)}
.asset .plate{aspect-ratio:16/9;border:none;border-radius:0}
.asset .kind{position:absolute;z-index:3;left:8px;top:8px;height:20px;padding:0 8px;border-radius:999px;display:inline-flex;align-items:center;background:var(--brand-grad);color:var(--on-brand);font-size:11px;font-weight:600}
.asset.k-video .kind{background:#6f8fae;color:#0d1116}
.asset.k-audio .kind{background:var(--green);color:#0d1116}
.asset .tools{position:absolute;z-index:4;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(0,0,0,.55);opacity:0;transition:.15s}
.asset:hover .tools{opacity:1}
.asset .tools .ic{width:32px;height:32px;border-radius:999px;background:var(--text);color:#141210;border:none;font-size:14px}
.asset .ft{padding:12px;border-top:1px solid var(--line-3)}
.asset .fn{font-size:13.5px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asset .fs{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 12px}
.storage{display:flex;align-items:center;gap:10px;margin-top:12px}
.storage .bar{flex:1;height:5px;border-radius:3px;background:var(--soft-2);overflow:hidden;display:flex}
.storage .bar i{display:block;height:100%}
.dropzone{border:1px dashed var(--line);border-radius:10px;padding:16px;text-align:center;background:var(--brand-soft);cursor:pointer;margin-top:10px}
.dropzone:hover{background:rgba(224,179,106,.14)}
.dropzone .t{font-size:12px;color:var(--text)}
.dropzone .s{font:10px var(--mono);color:var(--dim);margin-top:3px}
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:7px;background:var(--bg-2);padding:0 9px;height:27px}
.search input{background:none;border:none;outline:none;color:var(--text);font:11.5px var(--sans);width:150px}
.search input::placeholder{color:var(--dim)}
/* ---------- product: ledger / admin ---------- */
.stat{padding:14px 15px;border:1px solid var(--line-2);border-radius:11px;background:linear-gradient(180deg,var(--panel-2),var(--panel))}
.stat .k{font:10.5px var(--mono);letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.stat .v{font-size:22px;font-weight:600;color:var(--text);margin-top:4px;letter-spacing:.01em}
.stat .s{font-size:10.5px;color:var(--dim);margin-top:2px}
.pager{display:flex;align-items:center;gap:6px;margin-top:12px;font:11px var(--mono);color:var(--dim)}
.node{padding:12px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel)}
.node .r1{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.node .nm{font:11.5px var(--mono);color:var(--text)}
.node .meta{font:10px var(--mono);color:var(--dim);line-height:1.8}
/* ---------- drawer / modal / toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:var(--bg-2);border-left:1px solid var(--line);z-index:50;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .24s ease}
.drawer.on{transform:none}
.drawer-hd{display:flex;align-items:center;gap:8px;padding:13px 14px;border-bottom:1px solid var(--line-3)}
.drawer-hd .t{font-size:12.5px;color:var(--text)}
.drawer-hd .x{margin-left:auto;width:24px;height:24px;border-radius:6px;border:1px solid var(--line-2);background:none;color:var(--muted);cursor:pointer}
.drawer-bd{flex:1;overflow:auto;padding:12px 14px}
.drawer-ft{display:flex;align-items:center;gap:8px;padding:11px 14px;border-top:1px solid var(--line-3)}
.drawer-ft .sp{margin-left:auto}
.pick{position:relative;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;cursor:pointer;aspect-ratio:4/3}
.pick:hover{border-color:var(--line)}
.pick.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand-dim)}
.pick .tick{position:absolute;z-index:4;right:4px;top:4px;width:15px;height:15px;border-radius:4px;background:rgba(0,0,0,.55);border:1px solid var(--line-2);color:transparent;font:9px/13px var(--mono);text-align:center}
.pick.on .tick{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.pick .fn{position:absolute;z-index:3;left:0;right:0;bottom:0;font:8.5px var(--mono);color:#cfc6b7;background:linear-gradient(0deg,rgba(0,0,0,.8),transparent);padding:8px 4px 3px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(0,0,0,.6);padding:20px}
.modal.on{display:grid}
.modal-box{width:100%;max-width:380px;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow);padding:16px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:70;
  display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel-3);color:var(--text);font-size:12px;box-shadow:var(--shadow);transition:.22s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast .k{color:var(--brand);font-family:var(--mono);font-size:10.5px;letter-spacing:.1em}
/* ---------- proposal ---------- */
.hero{position:relative;padding:26px 0 22px;border-bottom:1px solid var(--line-3);overflow:hidden}
.hero .kick{font:10.5px/1 var(--mono);letter-spacing:.2em;color:var(--brand-dim);text-transform:uppercase;margin-bottom:14px}
.hero h1{font-size:clamp(24px,3.4vw,36px);line-height:1.28;margin:0 0 12px;font-weight:700;letter-spacing:.01em}
.hero h1 em{font-style:normal;color:var(--brand-2)}
.hero .lede{max-width:760px;font-size:13px}
.hero-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
.hero-act{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}
.tok{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:10px}
.tok .t{border:1px solid var(--line-2);border-radius:9px;padding:9px;background:var(--panel)}
.tok .sw{height:34px;border-radius:6px;border:1px solid var(--line-2);margin-bottom:7px}
.tok .n{font:10.5px var(--mono);color:var(--text)}
.tok .v{font:9.5px var(--mono);color:var(--dim);margin-top:2px;word-break:break-all}
.tok .u{font-size:10.5px;color:var(--muted);margin-top:5px}
.matrix{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.matrix .card{padding:15px}
.matrix .k{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font:12px var(--serif);margin-bottom:9px}
.matrix .t{font-size:12.5px;color:var(--text);margin-bottom:4px}
.matrix .d{font-size:11.5px;color:var(--muted);line-height:1.8}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.checks div{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line-3);border-radius:8px;padding:9px 11px;font-size:11.5px;color:var(--muted);background:var(--soft-1)}
.checks b{color:var(--brand);font-weight:500;flex:0 0 auto}
.risk{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.risk .r{border:1px solid var(--line-2);border-radius:9px;padding:11px 12px;background:var(--panel)}
.risk .r .t{font-size:11.5px;color:var(--text);margin-bottom:3px;display:flex;gap:6px;align-items:center}
.risk .r .d{font-size:11px;color:var(--muted);line-height:1.75}
/* ---------- auth：与线上 AuthPage 同构（独立于 Layout、min-h-screen 居中、max-w-md 单卡） ---------- */
body.bare .nav,body.bare .legal,body.bare .foot{display:none}
body.bare .main{max-width:none;padding:0}
.authwrap{position:relative;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 16px;overflow:hidden}
.agl{position:absolute;width:384px;height:384px;border-radius:50%;filter:blur(64px);pointer-events:none}
.agl.a{top:-160px;left:25%;background:rgba(224,179,106,.16)}
.agl.b{bottom:-160px;right:25%;background:rgba(207,106,95,.12)}
body.light .agl.a{background:rgba(75,107,245,.16)}
body.light .agl.b{background:rgba(124,174,139,.16)}
.authcard{position:relative;width:100%;max-width:448px;padding:32px;border:1px solid var(--line-2);border-radius:16px;background:linear-gradient(180deg,var(--panel-2),var(--panel));box-shadow:var(--shadow)}
.authcard .hd{text-align:center;margin-bottom:32px}
.authcard .hd .mk{display:flex;margin:0 auto 12px}
.authcard .hd h1{font-size:20px;font-weight:600;line-height:1.4;margin:0;color:var(--text)}
.authcard .hd p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.atabs{display:grid;grid-template-columns:1fr 1fr;border-radius:12px;background:var(--soft-2);padding:4px;margin-bottom:24px}
.atab{border:none;background:none;border-radius:8px;padding:8px 0;font-size:13px;color:var(--muted);cursor:pointer}
.atab:hover{color:var(--text)}
.atab.on{background:var(--panel-2);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.32)}
body.light .atab.on{background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.1)}
.aform{display:flex;flex-direction:column;gap:16px}
.aagree{display:flex;align-items:flex-start;gap:8px;font-size:11.5px;line-height:1.7;color:var(--muted);cursor:pointer}
.aagree input{margin-top:2px;accent-color:var(--brand)}
.afoot{margin:16px 0 0;text-align:center;font-size:11.5px;line-height:1.8;color:var(--muted)}
@media(max-width:1120px){
  .compose-grid{grid-template-columns:1fr}

.range-slider { <i>track:#2a2621; thumb:#e0b36a</i> }</pre></div>

/* ================= 创作 · 单段模式 ================= */
function taskCard(t) {
  const done = t.status === 'done';
  const spend = resCost(t.sec, t.res);
  return `<div class="task" data-task="${t.id}">
    <div class="chips">
      ${statusPill(t)}
      <span class="chip">${t.mode}</span>
      <span class="chip">${t.aspect}</span>
      <span class="chip">${t.sec}s</span>
      <span class="chip">${t.res}</span>
      <span class="when">${t.at}</span>
    </div>
    <p class="prompt" title="${esc(t.title)}">${esc(t.title)}</p>
    ${done ? `<div class="video">${plate(t.mode + ' · ' + t.res, t.aspect, 'k-video')}</div>
    <div class="foot">
      <button class="btn sm" data-act="toast" data-arg="播放演示成片（原型不含真实视频）">播放</button>
      <button class="btn sm ghost" data-act="toast" data-arg="已开始下载">下载</button>
      <span class="cost">消耗 ${spend} 积分</span>
      <button class="del" title="删除" data-act="delTask" data-arg="${t.id}">✕</button>
    </div>
    ${t.res === '768p' ? `<div class="up"><span>◈</span><span>高清升级：</span><button class="chip gold i" data-act="toast" data-arg="已提交升级到 2K（+15 积分）">2K +15</button><button class="chip gold i" data-act="toast" data-arg="已提交升级到 4K（+30 积分）">4K +30</button></div>` : ''}` : ''}
    ${t.status === 'fail' ? `<div class="err"><span>⚠</span><span style="flex:1">参考图分辨率不足，请换 ≥720p 的图后重试</span><button class="btn ghost sm" data-act="toast" data-arg="已重新提交 · 积分未重复扣除">重试</button></div>` : ''}
    ${t.status === 'running' ? `<div class="run"><div class="prog"><i style="width:${Math.round(t.progress)}%"></i></div><span>生成中 · <span data-live="pg">${Math.round(t.progress)}%</span></span></div>` : ''}
  </div>`;
}

}

  document.body.classList.toggle('bare', state.route === 'auth');
  $('#brandLockup').innerHTML = markHTML(34) + '<span class="word">海白菜</span>';
  $('#navMenu').innerHTML = NAV.map((n) => `<button class="nvi ${n.group.includes(state.route) ? 'on' : ''}" data-act="nav" data-arg="${n.k}" title="${n.label}"><span class="i">${n.i}</span>${n.label}</button>`).join('');
  $('#themeBtn').textContent = state.theme === 'light' ? '回到暗金' : '明色对照';
  $('#logoBtn').textContent = '标识：' + (LOGO_SHORT[state.logo] || '徽章');
}
function render(resetScroll) {
  const view = $('#view');
  view.innerHTML = (PAGES[state.route] || PAGES.create)();
  syncChrome();
  if (resetScroll) window.scrollTo(0, 0);
}
function go(k) {
  if (location.hash === '#/' + k) { state.route = k; render(true); }
  else location.hash = '#/' + k;
}

/* ================= 事件 ================= */
function setLive(sel, val) { const el = $(sel); if (el) el.textContent = val; }
function syncCost() { setLive('[data-live="cost"]', cost()); }
function syncDirector() {
  setLive('[data-live="totalsec"]', dTotalSec());
  setLive('[data-live="totalcost"]', dTotalCost());
}

const ACTION = {
  nav: (a) => {
    if (PAGES[a]) return go(a);
    if (a === 'hibtv') return toast('短剧工作台是另一套布局，不在本次换色范围', 'SCOPE');
    toast('暂未接入：' + a, 'HINT');
  },
  cycleLogo: () => {
    const order = ['badge', 'raw', 'glow', 'mono'];
    const next = order[(order.indexOf(state.logo) + 1) % order.length];
    state.logo = next; render(); toast('标识：' + LOGO_LABEL[next]);
  },
  logo: (a) => { state.logo = a; render(); toast('标识方案：' + (LOGO_LABEL[a] || a)); },
  theme: () => {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    document.body.classList.toggle('light', state.theme === 'light');
    syncChrome();
    toast(state.theme === 'light' ? '已切到现网浅色版：结构一致，只换令牌' : '已回到暗金主题', 'THEME');
  },
  dismissLegal: () => { const el = $('#legalBar'); if (el) el.remove(); },
  legalLink: (a) => toast('线上为 /legal/*.html：' + a, 'LEGAL'),
  pop: () => { state.pop = !state.pop; render(); },
  setMode: (a) => { state.mode = a; state.pop = false; render(); toast(a === 'r2v' ? '全能参考：可混传图片 / 视频 / 音频' : '首尾帧：分别指定第一帧与最后一帧'); },
  enhance: () => { state.enhance = !state.enhance; render(); toast(state.enhance ? '提示词增强已开启（qwen-flash）' : '提示词增强已关闭'); },
  setRes: (a) => { state.res = a; render(); toast('分辨率 ' + a + ' · 积分已重算'); },
  setDur: (a) => { state.dur = +a; render(); },
  setAspect: (a) => { state.aspect = a; render(); },
  submit: () => {
    if (!state.prompt.trim()) { toast('先写一句提示词，再开始创作', 'HINT'); return; }
    const t = { id: 'T' + (1000 + state.tasks.length + 5), title: state.prompt.slice(0, 42), status: 'running', progress: 4, sec: state.dur, res: state.res, aspect: state.aspect, mode: '单段', at: '刚刚' };
    state.tasks.unshift(t);
    state.prompt = '';
    render();
    toast('已提交 · ' + resCost(t.sec, t.res) + ' 积分已冻结，完成结算', 'QUEUE');
  },
  filter: () => toast('已切换筛选（演示）'),
  delTask: (a) => { state.tasks = state.tasks.filter((t) => t.id !== a); render(); toast('已删除 ' + a + '（成片与积分记录保留）'); },
  scrollTo: (a) => { const el = document.getElementById(a); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
  openDrawer: (a) => openDrawer(a),
  closeDrawer: () => closeDrawer(),
  drawerFilter: (a) => { state.drawer.filter = a; renderDrawer(); },
  pick: (a) => {
    const d = state.drawer;
    const single = d.target === 'first' || d.target === 'last' || d.target === 'adv';
    if (single) d.picked = [a];
    else d.picked = d.picked.includes(a) ? d.picked.filter((x) => x !== a) : d.picked.concat([a]).slice(0, 9);
    renderDrawer();
  },
  confirmPick: () => {
    const d = state.drawer, ids = d.picked.slice();
    if (!ids.length) { toast('先选一个素材', 'HINT'); return; }
    if (d.target === 'ref') state.refs = Array.from(new Set(state.refs.concat(ids))).slice(0, 9);
    else if (d.target === 'first') state.first = ids[0];
    else if (d.target === 'last') state.last = ids[0];
    else if (d.target === 'adv') state.adv.img = ids[0];
    else if (d.target && d.target.indexOf('shot:') === 0) state.shots[+d.target.split(':')[1]].refs = ids;
    closeDrawer(); render(); toast('已加入 ' + ids.length + ' 个素材');
  },
  delRef: (a, el) => {
    const ctx = el.dataset.ctx || 'main';
    if (ctx.indexOf('shot:') === 0) state.shots[+ctx.split(':')[1]].refs = state.shots[+ctx.split(':')[1]].refs.filter((x) => x !== a);
    else state.refs = state.refs.filter((x) => x !== a);
    render();
  },
  addShot: () => { state.shots.push({ p: '', sec: 5, refs: [] }); render(true); toast('已添加一段 · 时长默认 5s'); },
  delShot: (a) => { state.shots.splice(+a, 1); render(); toast('已删除第 ' + (+a + 1) + ' 段'); },
  submitDirector: () => {
    if (!state.shots.length) { toast('至少留一段', 'HINT'); return; }
    const total = dTotalSec();
    const t = { id: 'T' + (2000 + state.tasks.length), title: '分镜任务 · ' + state.shots.length + ' 段 / ' + total + 's', status: 'running', progress: 3, sec: total, res: '768p', aspect: state.aspect, mode: '分镜', at: '刚刚' };
    state.tasks.unshift(t);
    render(true);
    toast('已提交 ' + state.shots.length + ' 段 · 预计 ' + dTotalCost() + ' 积分', 'QUEUE');
  },
  advStep: (a) => { state.adv.step = a; render(true); },
  advPick: (a) => {
    const n = +a, p = state.adv.picked;
    state.adv.picked = p.includes(n) ? p.filter((x) => x !== n) : p.concat([n]).sort();
    if (!state.adv.picked.length) state.adv.picked = [n];
    render();
  },
  advGen: () => {
    if (!state.adv.img) { toast('先选一张商品主图', 'HINT'); return; }
    state.adv.step = 'images'; render(true);
    toast('正在出 4 张候选广告图 · 12 积分', 'GEN');
  },
  advRegen: () => toast('已按同一提示词重抽一组 · 12 积分', 'GEN'),
  advGo: () => { state.adv.step = 'video'; state.adv.progress = 0; render(true); toast('候选图已锁定，开始合成 9:16 成片', 'GEN'); advTick(true); },
  advReset: () => { state.adv = { step: 'form', img: 'a10', name: '极简护肤精华 30ml', point: '', points: ['成分单一', '18 小时续航不干', '按压泵头'], auto: true, sec: 15, aspect: '9:16', picked: [2], progress: 0 }; render(true); toast('已新建一条广告片'); },
  setAdvSec: (a) => { state.adv.sec = +a; render(); },
  toggleAuto: () => { state.adv.auto = !state.adv.auto; render(); toast(state.adv.auto ? '自动确认：候选图出完直接进视频' : '手动确认：候选图出完需要你点确认'); },
  addPoint: () => {
    const v = state.adv.point.trim();
    if (!v) { toast('先输入一条卖点', 'HINT'); return; }
    state.adv.points.push(v); state.adv.point = ''; render(); toast('已添加卖点：' + v);
  },
  delPoint: (a) => { state.adv.points.splice(+a, 1); render(); },
  clearAdvImg: () => { state.adv.img = null; render(); },
  assetFilter: (a) => { state.assets.filter = a; render(); },
  delAsset: (a) => { const i = ASSETS.findIndex((x) => x.id === a); const n = ASSETS[i].n; ASSETS.splice(i, 1); render(); toast('已删除 ' + n); },
  upload: () => toast('演示：真实上传走 /api/uploads，原型只加一张占位素材', 'UPLOAD'),
  ledgerTab: (a) => { state.ledger.tab = a; render(); },
  adminTab: (a) => { state.admin.tab = a; render(); },
  cloud: (a) => { state.admin.cloud = a; render(); toast(a === 'on' ? '已开机 · 等待心跳' : '已关机 · 队列任务保留'); },
  adjust: (a) => openAdjust(a),
  closeModal: () => closeModal(),
  adjustSave: (a) => {
    const amt = parseInt($('#adjAmt').value, 10) || 0;
    const u = state.admin.users.find((x) => x.id === a);
    if (u) u.credits += amt;
    closeModal(); render(); toast('已调整 ' + amt + ' 积分 · 已写入流水');
  },
  genCodes: () => toast('已生成 5 个兑换码（演示）', 'ADMIN'),
  authMode: (a) => { state.auth.mode = a; render(); toast(a === 'login' ? '登录：输入邮箱与密码' : '注册：昵称 + 密码，勾选协议后赠试用积分'); },
  login: () => { go('create'); toast('已登录 · 演示账号 creator@hibtv.cn'); },
  logout: () => { go('auth'); toast('已退出登录（演示）'); },
  toast: (a) => toast(a),
};

document.addEventListener('click', (e) => {
  // 点空白处收起设置弹层
  if (state.pop && !e.target.closest('.popwrap')) { state.pop = false; render(); }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  e.preventDefault();
  const fn = ACTION[el.dataset.act];
  if (fn) fn(el.dataset.arg, el);
});

document.addEventListener('input', (e) => {
  const t = e.target, b = t.dataset.bind;
  if (!b) return;
  if (b === 'prompt') { state.prompt = t.value; setLive('[data-live="count"]', t.value.length + ' / 2000'); }
  else if (b === 'style') state.style = t.value;
  else if (b === 'shotPrompt') state.shots[+t.dataset.arg].p = t.value;
  else if (b === 'sec') {
    const i = +t.dataset.arg;
    state.shots[i].sec = +t.value;
    setLive(`[data-live="sec-${i}"]`, t.value + '.0s');
    setLive(`[data-live="segcost-${i}"]`, resCost(+t.value, '768p') + ' 积分');
    syncDirector();
  }
  else if (b === 'advName') state.adv.name = t.value;
  else if (b === 'point') state.adv.point = t.value;
  else if (b === 'assetSearch') { state.assets.q = t.value; renderAssetGrid(); }
  else if (b === 'scene') { state.scene = t.value; }
});

document.addEventListener('change', (e) => {
  if (e.target.dataset.bind === 'scene') state.scene = e.target.value;
});

/* 广告片成片进度（演示定时器） */
function advTick(start) {
  clearInterval(advTick._t);
  if (!start) return;
  advTick._t = setInterval(() => {
    const a = state.adv;
    if (a.step !== 'video') { clearInterval(advTick._t); return; }
    a.progress = Math.min(100, a.progress + 6 + Math.random() * 8);
    const bar = $('[data-live="advbar"]'), pct = $('[data-live="advpct"]');
    if (bar) bar.style.width = a.progress.toFixed(0) + '%';
    if (pct) pct.textContent = a.progress.toFixed(0) + '%';
    if (a.progress >= 100) { clearInterval(advTick._t); render(); toast('成片完成 · 可下载或从这组图再建一条', 'DONE'); }
  }, 650);
}

/* 任务进度（演示定时器） */
setInterval(() => {
  let done = false;
  state.tasks.forEach((t) => {
    if (t.status !== 'running') return;
    t.progress = Math.min(100, t.progress + 3 + Math.random() * 5);
    if (t.progress >= 100) { t.status = 'done'; t.progress = 100; done = true; toast('生成完成 · 可播放与下载', 'DONE'); }
    const card = document.querySelector(`[data-task="${t.id}"]`);
    if (card) {
      const bar = card.querySelector('.prog > i');
      if (bar) bar.style.width = Math.round(t.progress) + '%';
      const pg = card.querySelector('[data-live="pg"]');
      if (pg) pg.textContent = Math.round(t.progress) + '%';
    }
  });
  if (done) render();
}, 1400);

/* ---------------- 启动 ---------------- */
function boot() {
  const k = (location.hash || '').replace(/^#\/?/, '');
  state.route = PAGES[k] ? k : 'create';
  // 便于截图与分享：?light=1 直接以现网浅色版打开；?logo=badge 指定标识处理
  if (new URLSearchParams(location.search).get('light') === '1') {
    state.theme = 'light';
    document.body.classList.add('light');
  }
  const lg = new URLSearchParams(location.search).get('logo');
  if (lg && LOGO_LABEL[lg]) state.logo = lg;
  render(true);
  toast('这是方案预览：页面结构与线上一致，只换颜色与标识', 'READY');
}
window.addEventListener('hashchange', () => {
  const k = (location.hash || '').replace(/^#\/?/, '');
  state.route = PAGES[k] ? k : 'proposal';
  render(true);
});
boot();
</script>
</body>
</html>
