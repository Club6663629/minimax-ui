<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>hibtv · 短剧工作台 · 可点击原型</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --bg:#0a0908;--bg-2:#0e0d0b;--panel:#131110;--panel-2:#191614;--panel-3:#211d19;
  --line:rgba(224,179,106,.16);--line-2:rgba(255,255,255,.075);--line-3:rgba(255,255,255,.04);
  --gold:#e0b36a;--gold-2:#f3d7a8;--gold-dim:rgba(224,179,106,.45);
  --text:#e9e3d7;--muted:#948b7e;--dim:#635c53;
  --red:#cf6a5f;--green:#7cae8b;--blue:#7d9ab5;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --serif:"Songti SC","Noto Serif SC","STSong",serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.62 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:var(--gold);text-decoration:none}
img{display:block}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
.app{display:flex;height:100vh;overflow:hidden}
/* ---------- rail ---------- */
.rail{width:58px;flex:0 0 58px;background:#080706;border-right:1px solid var(--line-3);display:flex;flex-direction:column;align-items:center;padding:8px 0 10px;gap:4px}
.logo{width:38px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font:700 12px/1 var(--mono);letter-spacing:.02em;color:var(--gold-2);background:linear-gradient(160deg,rgba(224,179,106,.16),rgba(224,179,106,.02));border:1px solid var(--line);margin-bottom:8px}
.rail-list{display:flex;flex-direction:column;gap:2px;align-items:center;width:100%}
.rail-item{width:46px;height:46px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#8b8378;font-size:10px;cursor:pointer;border:1px solid transparent;background:none;font-family:var(--sans)}
.rail-item svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.4}
.rail-item:hover{color:#d8d1c4;background:rgba(255,255,255,.03)}
.rail-item.on{color:var(--gold);background:rgba(224,179,106,.1);border-color:var(--line)}
.rail-item.on svg{stroke:var(--gold)}
.rail-sep{width:24px;height:1px;background:var(--line-2);margin:8px 0}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:2px;width:100%}
/* ---------- shell ---------- */
.col{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:46px;flex:0 0 46px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line-3);background:linear-gradient(180deg,#0b0a09,#090807)}
.crumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.crumb b{color:var(--text);font-weight:500}
.crumb .sep{color:#3d3933}
.crumb .prj{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.crumb .prj:hover{color:var(--gold)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.tbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:7px;border:1px solid var(--line-2);background:rgba(255,255,255,.02);color:#cfc8bb;font:12px var(--sans);cursor:pointer}
.tbtn:hover{border-color:var(--line);color:var(--gold-2)}
.tbtn .ico{font-size:12px;opacity:.8}
.tbtn .q{min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--gold);color:#161310;font:600 10px/16px var(--mono);text-align:center}
.stage{flex:1;display:flex;min-height:0}
.stage.no-side .side{display:none}
.stage.no-panel .panel{display:none}
.side{width:236px;flex:0 0 236px;border-right:1px solid var(--line-3);background:var(--bg-2);overflow:auto;padding:14px 10px 20px}
.side-head{font-size:10.5px;letter-spacing:.16em;color:#6d665c;text-transform:uppercase;padding:0 8px 10px}
.subnav{display:flex;flex-direction:column;gap:1px;margin-bottom:14px}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:6px;color:#a89f92;font-size:12.5px;cursor:pointer;border:1px solid transparent}
.nav-item:hover{background:rgba(255,255,255,.03);color:#ddd5c7}
.nav-item.on{background:rgba(224,179,106,.1);border-color:var(--line);color:var(--gold-2)}
.nav-item .n{margin-left:auto;font:10.5px var(--mono);color:#6d665c}
.nav-item.on .n{color:var(--gold)}
.ep-list{display:flex;flex-direction:column;gap:5px}
.ep-item{padding:7px 9px;border-radius:7px;border:1px solid transparent;cursor:pointer;background:rgba(255,255,255,.014)}
.ep-item:hover{background:rgba(255,255,255,.035)}
.ep-item.on{background:rgba(224,179,106,.08);border-color:var(--line)}
.ep-item .r1{display:flex;align-items:baseline;gap:6px}
.ep-item .no{font-size:12px;color:#d9d1c3}
.ep-item .t{margin-left:auto;font:10px var(--mono);color:#7d766b}
.ep-item .r2{font-size:11px;color:#6d665c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ep-item .r2 em{color:var(--gold-dim);font-style:normal}
.mini-row{display:flex;align-items:center;gap:6px;padding:4px 9px;color:#8e867a;font-size:11.5px;cursor:pointer;border-radius:5px;font-family:var(--mono)}
.mini-row:hover{background:rgba(255,255,255,.03);color:#cfc8bb}
.mini-row.on{color:var(--gold)}
.mini-row .ok{color:var(--green);font-size:9px}
.main{flex:1;overflow:auto;padding:18px 26px 32px;min-width:0}
.panel{width:326px;flex:0 0 326px;border-left:1px solid var(--line-3);background:var(--bg-2);overflow:auto;padding:16px 14px 30px}
/* ---------- typography ---------- */
.eyebrow{font:10.5px/1 var(--mono);letter-spacing:.16em;color:#6d665c;text-transform:uppercase;margin-bottom:10px}
.eyebrow em{color:var(--gold-dim);font-style:normal}
.h1{font-size:25px;line-height:1.25;font-weight:700;letter-spacing:.01em;margin:0 0 6px}
.lede{color:#a49b8e;font-size:12.5px;max-width:900px;margin:0}
.lede em{color:var(--gold-2);font-style:normal}
.h2{font-size:14px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.h2::before{content:"";width:2px;height:13px;background:var(--gold);border-radius:2px}
.sec{margin-top:26px}
.mono{font-family:var(--mono)}
.mut{color:var(--muted)}
.dim{color:var(--dim)}
.small{font-size:11.5px}
.tiny{font-size:10.5px}
hr.rule{border:none;border-top:1px solid var(--line-3);margin:16px 0}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:31px;padding:0 13px;border-radius:7px;border:1px solid var(--line-2);background:rgba(255,255,255,.025);color:#d3cbbe;font:12.5px var(--sans);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--line);color:var(--gold-2);background:rgba(224,179,106,.07)}
.btn.gold{background:linear-gradient(180deg,#eac389,#dcaa5e);border-color:#e3b878;color:#1b1611;font-weight:600}
.btn.gold:hover{background:linear-gradient(180deg,#f2cfa0,#e3b477);color:#1b1611}
.btn.ghost{background:transparent}
.btn.sm{height:26px;padding:0 9px;font-size:11.5px;border-radius:6px}
.btn.xs{height:22px;padding:0 7px;font-size:10.5px;border-radius:5px}
.btn[disabled],.btn.dis{opacity:.4;pointer-events:none}
.btn.on{border-color:var(--gold-dim);color:var(--gold-2);background:rgba(224,179,106,.12)}
.btn .dots{letter-spacing:.12em;font-size:10px;opacity:.55}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:5px;background:rgba(255,255,255,.035);border:1px solid var(--line-2);color:#b5ac9f;font-size:11px;white-space:nowrap}
.chip.gold{background:rgba(224,179,106,.13);border-color:var(--line);color:var(--gold-2)}
.chip.red{background:rgba(207,106,95,.12);border-color:rgba(207,106,95,.3);color:#e09a92}
.chip.green{background:rgba(124,174,139,.1);border-color:rgba(124,174,139,.28);color:#9fc9ac}
.chip.ghost{background:transparent}
.chip.i{cursor:pointer}
.chip.i:hover{border-color:var(--line);color:var(--gold-2)}
.kbd{font:10.5px var(--mono);padding:1px 5px;border-radius:4px;border:1px solid var(--line-2);color:#8f877b;background:rgba(255,255,255,.03)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block}
.dot.gray{background:#5a544b}
.dot.red{background:var(--red)}
.dot.gold{background:var(--gold)}
/* ---------- forms ---------- */
.field{margin-bottom:13px}
.label{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#a89f92;margin-bottom:6px}
.label .auto{font-size:10px;color:var(--gold-dim)}
.input,.select,.textarea{width:100%;background:#0d0c0a;border:1px solid var(--line-2);border-radius:7px;color:var(--text);font:12.5px var(--sans);padding:8px 10px;outline:none}
.input:focus,.select:focus,.textarea:focus{border-color:var(--gold-dim);box-shadow:0 0 0 3px rgba(224,179,106,.07)}
.textarea{resize:vertical;min-height:62px;line-height:1.7}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#7d766b 50%),linear-gradient(135deg,#7d766b 50%,transparent 50%);background-position:calc(100% - 15px) 14px,calc(100% - 10px) 14px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.switch{display:inline-flex;align-items:center;gap:7px;cursor:pointer;color:#a89f92;font-size:11.5px}
.switch input{display:none}
.switch .track{width:26px;height:15px;border-radius:8px;background:#2a2621;border:1px solid var(--line-2);position:relative;transition:.15s}
.switch .track::after{content:"";position:absolute;top:1.5px;left:1.5px;width:10px;height:10px;border-radius:50%;background:#7d766b;transition:.15s}
.switch input:checked + .track{background:rgba(224,179,106,.3);border-color:var(--gold-dim)}
.switch input:checked + .track::after{left:13px;background:var(--gold)}
.upbox{border:1px dashed rgba(224,179,106,.28);border-radius:9px;background:rgba(224,179,106,.025);padding:16px;text-align:center;cursor:pointer}
.upbox:hover{background:rgba(224,179,106,.06);border-color:var(--gold-dim)}
.upbox .t{font-size:12.5px;color:#cec6b8}
.upbox .s{font-size:10.5px;color:#7d766b;margin-top:4px}
.upbox.filled{text-align:left;background:#100e0c}
.upbox.filled .fn{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--gold-2)}
.upbox.filled .st{font:10.5px/1.7 var(--mono);color:#8b8377;margin-top:4px}
.upbox .chg{font-size:10.5px;color:#7d766b;margin-top:6px}
/* ---------- plates ---------- */
.plate{position:relative;overflow:hidden;border-radius:8px;border:1px solid var(--line-2);background:#100e0c;display:flex;align-items:center;justify-content:center;isolation:isolate}
.plate img{position:relative;z-index:2;width:100%;height:100%;object-fit:cover}
.plate .ph{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  background:
   radial-gradient(120% 80% at 50% 0%,rgba(224,179,106,.11),transparent 62%),
   repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 26px),
   repeating-linear-gradient(90deg,rgba(255,255,255,.028) 0 1px,transparent 1px 26px),
   linear-gradient(165deg,#241f19,#15120f 58%,#0e0d0b)}
.plate .ph b{font-weight:500;font-size:10.5px;letter-spacing:.1em;color:#a79d8d;text-align:center;padding:0 8px}
.plate .ph i{font-style:normal;font:9.5px var(--mono);letter-spacing:.12em;color:#6f675c}
.plate .ph::before{content:"";width:34px;height:34px;border-radius:50%;border:1px solid rgba(224,179,106,.22);box-shadow:inset 0 0 18px rgba(224,179,106,.1);margin-bottom:2px}
.plate.k-scene .ph::before{width:44px;height:26px;border-radius:3px;transform:perspective(40px) rotateX(24deg)}
.plate.k-prop .ph::before{width:36px;height:24px;border-radius:4px}
.plate.k-frame .ph::before{width:24px;height:24px;border-radius:50%;border-color:rgba(224,179,106,.4)}
.plate.k-frame .ph::after{content:"";position:absolute;width:0;height:0;border-left:7px solid rgba(224,179,106,.55);border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;margin-left:3px}
.plate .badge{position:absolute;z-index:3;left:7px;top:7px}
.plate .corner{position:absolute;z-index:3;right:6px;bottom:6px}
.plate .tools{position:absolute;z-index:4;left:0;right:0;top:0;display:flex;gap:5px;padding:6px;background:linear-gradient(180deg,rgba(0,0,0,.72),transparent);opacity:0;transition:.15s}
.plate:hover .tools{opacity:1}
.plate .stale{position:absolute;z-index:3;inset:0;background:repeating-linear-gradient(45deg,rgba(207,106,95,.1) 0 6px,transparent 6px 12px);border:1px solid rgba(207,106,95,.35);border-radius:8px}
/* .views 已并入美术卡的 .art-thumbs */
.vthumb{position:relative;aspect-ratio:3/4;border-radius:5px;overflow:hidden;border:1px solid var(--line-3);cursor:pointer}
.vthumb:hover{border-color:var(--gold-dim)}
.vthumb .lab{position:absolute;z-index:3;left:0;right:0;bottom:0;text-align:center;font-size:9px;color:#cfc6b7;background:linear-gradient(0deg,rgba(0,0,0,.78),transparent);padding:6px 2px 3px}
.vthumb .exp{position:absolute;z-index:4;top:2px;right:2px;width:12px;height:12px;border-radius:3px;background:rgba(0,0,0,.6);color:var(--gold);font-size:8px;line-height:12px;text-align:center}
.vthumb .stale{position:absolute;z-index:3;inset:0;background:repeating-linear-gradient(45deg,rgba(207,106,95,.14) 0 6px,transparent 6px 12px);border:1px solid rgba(207,106,95,.42)}
.plate .badge.chip{height:17px;font-size:9.5px;pointer-events:none}
/* ---------- cards / tables ---------- */
.card{background:var(--panel);border:1px solid var(--line-2);border-radius:10px}
.card-hd{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line-3)}
.card-hd .t{font-size:12.5px;color:#d5cdbf}
.card-bd{padding:14px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;font-weight:500;color:#847c70;font-size:10.5px;letter-spacing:.1em;padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line-3);color:#c6beb1;vertical-align:top}
.tbl tr:hover td{background:rgba(255,255,255,.016)}
.tbl tr.sel td{background:rgba(224,179,106,.06)}
.tbl .id{font:11px var(--mono);color:var(--gold-dim)}
.tbl .nm{color:#e6dfd2}
.tbl .edit{outline:none}
.tbl .edit:focus{background:#0d0c0a;box-shadow:0 0 0 1px var(--gold-dim) inset;border-radius:4px}
.empty{border:1px dashed var(--line-2);border-radius:12px;padding:34px 22px;text-align:center;background:radial-gradient(120% 90% at 50% -10%,rgba(224,179,106,.06),transparent 60%)}
.empty .glyph{width:42px;height:42px;border-radius:11px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--gold);font:14px var(--serif);margin:0 auto 12px;background:rgba(224,179,106,.07)}
.empty .t{font-size:14.5px;color:#ddd5c7;margin-bottom:6px}
.empty .s{font-size:12px;color:#8f877b;max-width:520px;margin:0 auto 14px}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 11px;border:1px solid var(--line-2);border-radius:9px;background:rgba(255,255,255,.016);margin:12px 0}
.toolbar .sp{margin-left:auto}
.toolbar .lab{font-size:10.5px;color:#7d766b;letter-spacing:.06em}
.seg{display:inline-flex;padding:2px;border-radius:7px;background:rgba(255,255,255,.03);border:1px solid var(--line-2)}
.seg .s{padding:4px 10px;border-radius:5px;font-size:11.5px;color:#9a9184;cursor:pointer}
.seg .s.on{background:rgba(224,179,106,.16);color:var(--gold-2)}
.tabs{display:flex;align-items:center;gap:7px;margin:12px 0}
.tab{height:28px;padding:0 11px;border-radius:6px;border:1px solid var(--line-2);color:#9a9184;font-size:12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;background:none}
.tab.on{background:rgba(224,179,106,.13);border-color:var(--line);color:var(--gold-2)}
.tab .n{font:10px var(--mono);opacity:.75}
/* ---------- progress ---------- */
.prog{height:4px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
.prog > i{display:block;height:100%;background:linear-gradient(90deg,#c99b55,#f3d7a8);border-radius:3px;transition:width .3s}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:8px;margin-top:10px}
.stage-item{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--line-2);border-radius:7px;font-size:11.5px;color:#a89f92;background:rgba(255,255,255,.015)}
.stage-item.on{border-color:var(--line);color:var(--gold-2);background:rgba(224,179,106,.07)}
.stage-item .n{margin-left:auto;font:10.5px var(--mono);color:#7d766b}
.genbar{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:9px;background:linear-gradient(90deg,rgba(224,179,106,.08),rgba(224,179,106,.02))}
.genbar .t{font-size:12px;color:var(--gold-2)}
.genbar .m{font:10.5px var(--mono);color:#8f877b}
/* ---------- cast ---------- */
.cast-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.cast-card{display:grid;grid-template-columns:196px 50px minmax(0,1fr);gap:10px;padding:12px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel)}
.cast-card:hover{border-color:rgba(224,179,106,.22)}
.cast-media{display:contents}
.cast-anchor{position:relative;min-width:0}
.cast-anchor .plate{aspect-ratio:3/4.55;cursor:zoom-in}
/* 图片操作按钮（照截图 15/18）：四个深色圆角方图标，默认隐藏，鼠标移到图上才浮现 */
.media-acts{position:absolute;z-index:6;left:0;right:0;top:8px;display:flex;gap:5px;padding:0 15% 0 8px;justify-content:flex-end;opacity:0;transition:opacity .09s linear}
.cast-anchor:hover .media-acts,.cast-anchor:focus-within .media-acts,.art-anchor:hover .media-acts,.art-anchor:focus-within .media-acts{opacity:1}
.media-acts .ic{position:relative;overflow:visible;width:26px;height:26px;display:flex;align-items:center;justify-content:center;padding:0;border:1px solid transparent;border-radius:8px;background:rgba(26,23,20,.92);color:#c9c3b9;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.media-acts .ic svg{width:14px;height:14px;display:block}
/* 命中区外扩：.ic 有 1px 透明描边，伪元素以 padding box(24×24) 为基准，故 -4/-3 才得到 32×30，并把 5px 缝隙完全盖住 */
.media-acts .ic::after{content:"";position:absolute;left:-4px;right:-4px;top:-3px;bottom:-3px;border-radius:9px}
.media-acts .ic:hover{border-color:rgba(224,179,106,.85);color:var(--gold-2)}
.media-acts .ic.del:hover{border-color:rgba(207,106,95,.7);color:#f0b3aa}
/* 文字说明（照截图 15 的浮层）：hover 到图标上，在按钮上方浮出一张小卡，金色动作名 + 一句说明 */
.media-acts .tip{position:absolute;z-index:9;bottom:calc(100% + 7px);right:0;right:calc(-31px * (4 - var(--k,1)));width:170px;padding:6px 8px;border:1px solid var(--line-2);border-radius:7px;background:rgba(14,12,10,.97);box-shadow:0 8px 20px rgba(0,0,0,.62);color:#b0a798;font-size:10px;line-height:1.6;letter-spacing:.01em;text-align:left;opacity:0;transform:translateY(3px);pointer-events:none;transition:opacity .05s linear,transform .05s linear}
.media-acts .tip b{color:var(--gold-2);font-weight:600}
.media-acts .ic:hover .tip,.media-acts .ic:focus-visible .tip{opacity:1;transform:translateY(0)}
.cast-viewcol{display:flex;flex-direction:column;gap:5px;min-width:0}
.cast-viewcol .vthumb{flex:1 1 0;min-height:0;aspect-ratio:auto}
.cast-viewcol .vthumb .lab{font-size:8px;padding:4px 1px 2px}

/* 真图策略：默认不请求图片（占位图缺失时避免刷 404）。
   把图放进 hibtv/assets/ 后，两种方式开启真图，二选一：
   ① URL 加 ?assets=1（file:// 下唯一可行）；
   ② 在本目录建 assets/manifest.json（内容 {} 即可），http(s) 下探测到就自动挂图。 */
let IMG_ON = /[?&]assets/.test(location.search);
if (!IMG_ON && /^https?:/.test(location.protocol)) {
  fetch('assets/manifest.json', { cache:'no-store' })
    .then(r => { if (r.ok) { IMG_ON = true; hydrateImgs(document); } })
    .catch(() => {});
}
function hydrateImgs(root){
  if (!IMG_ON) return;
  root.querySelectorAll('img[data-src]').forEach(im => { if (!im.getAttribute('src')) im.src = im.dataset.src; });
}

function simPlay(root, dur){
  const bar = $('.playbar .bar > i', root), tm = $('.playbar .time', root);
  if (!bar || !tm) return;
  clearInterval(T.play);
  let t = 0;
  tm.textContent = '0:00 / ' + fmtTime(dur);
  bar.style.width = '0%';
  T.play = setInterval(() => {
    t += Math.max(0.4, dur / 40);
    if (t >= dur) { t = dur; clearInterval(T.play); }
    bar.style.width = Math.min(100, t / dur * 100).toFixed(1) + '%';
    tm.textContent = fmtTime(t) + ' / ' + fmtTime(dur);
  }, 300);

function epBeatRows(e){
  const total = parseFloat(e.dur) || 240;
  let rows = String(e.summary).split(/[；;。]/).map(x => x.trim()).filter(Boolean);
  if (rows.length < 4) rows = String(e.summary).split(/[；;。，,]/).map(x => x.trim()).filter(Boolean);
  rows = rows.slice(0, 8);
  const per = +(total / rows.length).toFixed(1);
  return rows.map((t, i) => ({ n:i + 1, t:t, sec: i === rows.length - 1 ? +(total - per * (rows.length - 1)).toFixed(1) : per }));
}

/* ---------------- 日志与撤销 ---------------- */
const ROOTS = { S, CAST, SCENES, PROPS, EPS, BEATS, SEGMENTS, PROJECT, ALIGN };
function resolvePath(path){
  const keys = path.split('.');
  let obj = ROOTS[keys.shift()];
  while (keys.length > 1) obj = obj[keys.shift()];
  return { obj: obj, key: keys[0] };
}
function getPath2(path){ const r = resolvePath(path); return r.obj ? r.obj[r.key] : ''; }
function setPath2(path, val){ const r = resolvePath(path); if (r.obj) r.obj[r.key] = val; }
const LABELS = { S:'大纲', CAST:'角色表', SCENES:'场景表', PROPS:'道具表', EPS:'分集', BEATS:'剧本节拍', PROJECT:'项目设置', ALIGN:'对齐检查' };
function labelOf(path){ return (LABELS[path.split('.')[0]] || '内容'); }
function logChange(what, from, to, path){
  S.changes.unshift({ id:'h' + Date.now() + Math.floor(Math.random() * 99), at:'刚刚', who:'你', what:what, from:from || '（空）', to:to || '（空）', path:path });
}
function undoChange(id){
  const i = S.changes.findIndex(c => c.id === id);
  if (i < 0) return;
  const c = S.changes[i];
  if (c.path) setPath2(c.path, c.from === '（空）' ? '' : c.from);
  S.changes.splice(i, 1);
  render();
  toast('已撤销 1 处改动');
}

/* ---------------- 编辑 ---------------- */
function startEdit(el){
  if (el.dataset.editing) return;
  const path = el.dataset.edit;
  const old = String(getPath2(path) == null ? '' : getPath2(path));
  el.dataset.editing = '1';
  el.contentEditable = 'true';
  el.focus();
  try { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) {}
  let done = false;
  const finish = save => {
    if (done) return;
    done = true;
    el.contentEditable = 'false';
    const val = (el.innerText || '').trim();
    delete el.dataset.editing;
    if (save && val && val !== old) {
      setPath2(path, val);
      logChange(labelOf(path) + ' · ' + path.split('.').slice(-1)[0], old, val, path);
      render();
      toast('已改 1 处', { label:'撤销', fn:() => undoChange(S.changes[0].id) });
    } else {
      render();
    }
  };
  el.onblur = () => finish(true);
  el.onkeydown = ev => {
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); el.blur(); }
    if (ev.key === 'Escape') { el.innerText = old; el.blur(); }
    ev.stopPropagation();
  };
}

let T = {};
function startParse(){
  clearInterval(T.parse);
  S.outline.status = 'parsing'; S.outline.p = 0.04;
  T.parse = setInterval(() => {
    S.outline.p = Math.min(1, S.outline.p + 0.06);
    if (S.outline.p >= 1) {
      clearInterval(T.parse);
      S.outline.status = 'done'; S.project.ready = true;
      toast('大纲已就绪：10 集 / 30 场 / 15 角色 / 8 场景');
    }
    render();
  }, 280);
}
function runCast(){
  S.castStatus = 'generating'; S.castP = 0.06;
  go('/cast'); render();
  clearInterval(T.cast);
  T.cast = setInterval(() => {
    S.castP = Math.min(1, S.castP + 0.09);
    if (S.castP >= 1) {
      clearInterval(T.cast); S.castStatus = 'done';
      toast('15 张角色卡已生成，可逐张改图');
      if (S.pendingDraw) { S.pendingDraw = false; setTimeout(openDrawAll, 400); }
    }
    render();
  }, 220);
}
function startDraw(){
  S.drawing = 0.02;
  CAST.forEach(c => { S.cast[c.id] = { ver:(S.cast[c.id] && S.cast[c.id].ver) || 1, state:'drawing' }; });
  render();
  clearInterval(T.draw);
  T.draw = setInterval(() => {
    S.drawing = Math.min(1, S.drawing + 0.07);
    const n = Math.floor(S.drawing * CAST.length + 0.0001);
    CAST.forEach((c, i) => { S.cast[c.id] = Object.assign({}, S.cast[c.id], { state: i < n ? 'done' : 'drawing' }); });
    if (S.drawing >= 1) {
      clearInterval(T.draw); S.drawing = 0;
      CAST.forEach(c => { S.cast[c.id] = { ver:(S.cast[c.id] && S.cast[c.id].ver) || 1, state:'done' }; });
      toast('60 张锚点与派生图已出完（模拟）');
    }
    render();
  }, 300);
}

        arr.push(nv); S.segVer[id] = arr; S.segVerCur[id] = nv;

        toast(id + ' 新版本 v' + nv + ' 已出，可在监看里回切');
      }, 1500);
      break;
    }
    case 'useVer':
      S.segVerCur[d.id] = Number(d.v);
      render(); toast('已切到 ' + d.id + ' 的 v' + d.v); break;
    case 'history': toast('历史版本：v1 18:56 / v' + S.video.ver + ' 21:18；点版本可回切'); break;
    case 'segPrev': case 'segNext': {
      const i = SEGMENTS.indexOf(SEGMENTS.find(s => s.id === S.seg));
      const n = act === 'segNext' ? Math.min(21, i + 1) : Math.max(0, i - 1);
      go('/storyboard/' + (S.ep || 1) + '/' + SEGMENTS[n].id);
      break;
    }
    case 'export': toast('导出任务已加入队列：' + (S.ratio === '9:16' ? '1080 × 1920' : '1920 × 1080') + ' · MP4'); break;
    case 'sendScript': toast('已把这一段的提示词与参考图发到生成队列'); break;
    case 'readAloud': toast('朗读用角色音色，原型不播放真实音频'); break;
    case 'addBeat': BEATS.push({ n:BEATS.length + 1, who:'叶辰', line:'（新加的一拍）', note:'', sec:2.5 }); render(); toast('已加一拍，记得补秒数'); break;
    case 'sortBeat': toast('已按台词/动作重排；跨场不合并'); break;
    case 'restage': toast('已按“主位靠北、门口朝南”重排一版站位'); break;
    case 'queue':
      openLayer('<div class="drawer"><div class="drawer-hd"><div><div class="tiny dim">后台</div><div class="t">生成队列</div></div><span class="x" data-act="closeLayer">✕</span></div><div class="drawer-bd">'
        + S.queue.map(q => '<div class="card" style="margin-bottom:8px"><div class="card-bd"><div class="inline"><span class="small">' + q.name + '</span><span class="chip ' + (q.state === 'done' ? 'green' : 'gold') + '" style="margin-left:auto">' + (q.state === 'done' ? '已完成' : '排队中') + '</span></div><div class="tiny dim" style="margin-top:4px">' + q.cost + ' · 关掉页面也会继续</div></div></div>').join('')
        + '<div class="note">队列按“项目 → 任务”排：同一项目内串行，跨项目并行；失败的任务会保留失败原因，不会静默丢掉。</div></div><div class="drawer-ft"><button class="btn ghost" data-act="closeLayer">关闭</button></div></div>');
      break;
    case 'assets':
      openLayer('<div class="drawer" style="width:520px"><div class="drawer-hd"><div><div class="tiny dim">本剧</div><div class="t">资产库</div></div><span class="x" data-act="closeLayer">✕</span></div><div class="drawer-bd"><div class="split3">'
        + CAST.slice(0, 6).map(c => '<div>' + plate('cast', c.name, '锚点', 'assets/cast/' + c.id + '-front.jpg', '') + '<div class="tiny dim" style="margin-top:3px">' + c.name + '</div></div>').join('')
        + '</div><div class="sec"><div class="h2">场景</div><div class="split3">' + SCENES.slice(0, 3).map(s => '<div>' + plate('scene', s.name, '锚点', 'assets/scene/' + s.id + '-front.jpg', '') + '</div>').join('') + '</div></div></div><div class="drawer-ft"><button class="btn ghost" data-act="closeLayer">关闭</button><button class="btn gold" data-go="/assets">打开素材库</button></div></div>');
      break;
    case 'undo': undoChange(d.id); break;
    case 'undoAll': S.changes = []; render(); toast('已清空变更记录（演示）'); break;
    case 'saveSettings': toast('已保存：画幅 ' + S.ratio + '、模型 ' + PROJECT.textModel); break;
    case 'resetDemo':
      S.outline.status = 'done'; S.outline.p = 1; S.outline.inner = KERNEL; S.castStatus = 'done'; S.artTab = 'all'; S.ratio = '9:16';
      S.cast = {}; CAST.forEach(c => { S.cast[c.id] = { ver:1, state:'done' }; }); S.drawing = 0; S.rewrites = {};
      S.uploads = {}; S.hidden = {}; PENDING_UP = null;
      S.boardStatus = { 1:'done' }; S.segVer = { 'E01-07':[1] }; S.segVerCur = { 'E01-07':1 }; S.video.ver = 2;
      ALIGN[3].inArt = 3; ALIGN[3].miss = ['打脸特写光（第 6、7 集）'];
      go('/home'); render(); toast('演示数据已重置'); break;
    case 'addAsset': toast('上传入口在原型里省略，直接用 assets/ 目录替换占位图'); break;
    case 'verTip': toast('v0 是初始生成版本，保留可回切'); break;
    case 'demo':
      S.demo.on = !S.demo.on;
      if (S.demo.on) { closeLayer(); applyDemoStep(0); } else { closeLayer(); render(); }
      break;
    case 'demoNext': applyDemoStep(Math.min(DEMO_STEPS.length - 1, S.demo.i + 1)); break;
    case 'demoPrev': applyDemoStep(Math.max(0, S.demo.i - 1)); break;
    case 'demoExit': S.demo.on = false; closeLayer(); render(); break;
    default: break;
  }
}

/* ---------------- 演示模式 ---------------- */
const DEMO_STEPS = [
  { route:'/home', t:'从剧本到一集短剧', s:'导入剧本 + 美术设定 → 写大纲 → 角色 · 美术 · 剧本 → 分镜 → 出视频' },
  { route:'/home', t:'新建短剧项目', s:'首页只留一个入口：上传已经定稿的剧本和美术设定，不做小说改编' },
  { route:'/home', t:'上传剧本', s:'剧本必填：按“第 N 集 / 场号 / 角色：台词”识别', fn:() => { NP.script = false; NP.art = false; openNewProject(); } },
  { route:'/home', t:'上传美术设定', s:'美术设定必填：人物 / 服装 / 场景 / 道具 / 特效，按标题层级识别条目', fn:() => { NP.script = true; openNewProject(); } },
  { route:'/home', t:'上传后马上读出规模', s:'10 集 · 30 场 · 1,024 条台词 · 15 角色 / 8 场景 / 4 道具 · 5 处卡点', fn:() => { NP.art = true; openNewProject(); } },
  { route:'/home', t:'画面比例默认 9:16', s:'短剧投放标准；这一项写进所有锚点图、分镜图与成片，后期不单张改' },
  { route:'/home', t:'必须保留的名场面', s:'写进这里的场次不会被合场、不会被删减；剧本没有的场次不会凭空生出来' },
  { route:'/home', t:'初始化并创建大纲', s:'先出大纲骨架；不上游提前生成下游数据' },
  { route:'/outline/inner', t:'解析中', s:'剧本解析 1/1、美术设定解析 0/1，进度到 100% 自动进大纲', fn:() => { S.outline.status = 'parsing'; S.outline.p = 0.42; S.castStatus = 'empty'; } },
  { route:'/outline/inner', t:'大纲 · 内核', s:'一句话内核 + 卖点 + 受众 + 情绪曲线；没有“改编取舍”这一栏', fn:() => { S.outline.status = 'done'; } },
  { route:'/outline/cast', t:'大纲 · 角色表', s:'15 行角色：层级 / 定位 / 弧光 / 来源，双击单元格就地改' },
  { route:'/outline/ep', t:'大纲 · 分集与钩子', s:'每集两行：钩子与断点；偏差百分比来自剧本时长与目标时长' },
  { route:'/outline/align', t:'大纲 · 对齐检查（新增）', s:'剧本里出现的人、场景、道具、特效，美术设定是否都有——缺的那条会卡住出图' },
  { route:'/cast', t:'角色：空态', s:'一次生成角色卡、提示词与音色；已有数据不覆盖', fn:() => { S.castStatus = 'empty'; } },
  { route:'/cast', t:'角色卡总览', s:'每人一张卡：正面全身锚点 + 大头 / 侧面 / 背面', fn:() => { S.castStatus = 'done'; } },
  { route:'/cast', t:'锚点与派生', s:'后面几张都照着锚点改；改了描述或锚点，受影响的缩略图标红框' },
  { route:'/cast', t:'改图', s:'给一句话要求：参考原图重画，其余几张标成过期，可切回历史版本', fn:() => openReroll('cast', 'C01') },
  { route:'/cast', t:'出全部锚点图', s:'15 人 × 4 张 = 60 张，预计 18 分钟，后台排队', fn:() => openDrawAll() },
  { route:'/art', t:'美术：场景锚点', s:'正面是锚点，俯视 / 背面 / 左侧 / 右侧照着它改' },
  { route:'/art', t:'美术：道具组图', s:'道具也是多视角一组；下游分镜、出视频会自动挂上', fn:() => { S.artTab = 'prop'; } },
  { route:'/script/1', t:'剧本：一集一页', s:'左边集列表，右边这一集的 20 拍；每拍一个台词或动作 + 秒数', fn:() => { S.artTab = 'all'; } },
  { route:'/script/1', t:'台词带着“怎么说”', s:'表演提示会写进后面每一镜的视频提示词' },
  { route:'/storyboard/list', t:'分镜：段长与生成', s:'视频模型固定 ' + PROJECT.vidModel + '，选段长（13s）后生成本集' },
  { route:'/storyboard/1', t:'本集段表', s:'22 段 / 64 镜 / 4:36；每段 ≤ 13 秒' },
  { route:'/storyboard/1', t:'整集成片与时间轴', s:'22 段按顺序拼；点时间轴任意一段定位' },
  { route:'/storyboard/1/E01-07', t:'一段一页，一镜一卡', s:'秒数 / 景别 / 运镜 / 视频提示词；分镜图可以不出' },
  { route:'/storyboard/1/E01-07', t:'引用素材自动挂上', s:'每一镜用到的场景、角色、道具自动挂；不对就点 + 换' },
  { route:'/storyboard/1/E01-07', t:'一句话重写本段', s:'哪一段不满意，写一句要求只重写这一段的镜头提示词', fn:() => openRewrite() },
  { route:'/storyboard/1/E01-07', t:'右边是监看', s:'一键出片：提示词 + 参考图一起发给视频模型，排队出片' },
  { route:'/storyboard/1/E01-07', t:'引用素材管理', s:'场景 / 角色 / 道具 / 音色，发出去的参考图在这里改' },
  { route:'/video/1', t:'第 1 集成片', s:'22 / 22 段有片，276.0s（4:36）；重新合成会追加版本' },
  { route:'/video/1', t:'全流程回顾', s:'导入 → 大纲 → 角色 · 美术 · 剧本 → 分镜 → 出视频，每一步都能改、能撤销' }
];
function applyDemoStep(i){
  const st = DEMO_STEPS[i];
  if (!st) return;
  closeLayer();
  S.demo.i = i;
  if (st.fn) st.fn();
  if (location.hash !== '#' + st.route) location.hash = '#' + st.route;
  render();
}

/* ---------------- 事件 ---------------- */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a && !a.classList.contains('track')) { handleAct(a.dataset.act, a); return; }
  const g = e.target.closest('[data-go]');
  if (g) { go(g.dataset.go); return; }
});
document.addEventListener('dblclick', e => {
  const el = e.target.closest('[data-edit]');
  if (el) { e.preventDefault(); startEdit(el); }
});
document.addEventListener('change', e => {
  if (!e.target || e.target.id !== 'upFile') return;
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  PENDING_UP = URL.createObjectURL(f);
  const prev = $('#upPrev');
  if (prev) prev.innerHTML = '<img src="' + PENDING_UP + '" alt="" style="max-width:100%;max-height:240px;border-radius:8px;border:1px solid var(--line-2)">';
  const nm = $('#upName');
  if (nm) nm.textContent = f.name + ' · ' + Math.max(1, Math.round(f.size / 1024)) + ' KB';
  const ok = $('#upOk');
  if (ok) ok.classList.remove('dis');
});
document.addEventListener('keydown', e => {
  if (e.target.isContentEditable) return;
  if (!S.demo.on) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); applyDemoStep(Math.min(DEMO_STEPS.length - 1, S.demo.i + 1)); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); applyDemoStep(Math.max(0, S.demo.i - 1)); }
  if (e.key === 'Escape') { S.demo.on = false; closeLayer(); render(); }
});
window.addEventListener('hashchange', render);
if (!location.hash) location.hash = '#/home';
render();
/* @@APPEND */
</script>
