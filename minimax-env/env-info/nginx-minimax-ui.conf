# MiniMax H3 Studio 前端（测试部署，独立端口 8080）
server {
    listen 8080;
    server_name _;

    client_max_body_size 50m;

    root /data/workspace/minimax-ui/web/dist;
    index index.html;

    # 视频产物临时访问（复用已验证通的 minimax.ai4ss.com 链路）
    location /video/ {
        alias /data/ComfyUI/output/video/;
        autoindex on;
        add_header Content-Type video/mp4;
        add_header Accept-Ranges bytes;
    }

    # ===== ComfyUI 工作流画布反代（节点直连，只读浏览用） =====
    # 通用反代参数：HTTP + WebSocket 全支持


    # 2026-09-14 按用户指示：只保留 /comfy100/（A100）挂载；以下前缀已取消挂载（显式 404，避免 SPA 回退误判）
    location /comfy45/  { return 404; }
    location /comfy51/  { return 404; }
    location /comfy246/ { return 404; }
    location /comfy205/ { return 404; }
    # 100 = A100-SXM4-40GB 生成节点（2026-09-14 按用户指示挂载；A100 已暂时摘除出生产路由，仅画布浏览用）
    location /comfy100/ {
        proxy_pass http://127.0.0.1:8188/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /files/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
