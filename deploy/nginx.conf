# H3 Studio 站点配置
# 安装：复制到 /etc/nginx/sites-available/minimax-ui 并软链到 sites-enabled
# 与 ComfyUI、FastAPI 同机部署：前端静态资源 + /api、/files 反代

server {
    listen 80;
    server_name _;

    # 图片上传上限（与后端 20MB 限制匹配，留冗余）
    client_max_body_size 50m;

    # 前端静态资源（vite build 产物）
    root /opt/minimax-ui/web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 视频/图片下载反代（大文件流式转发）
    location /files/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 安全：ComfyUI（:8188）仅监听 127.0.0.1，严禁在此暴露
}
